name: Release

# Push a tag like v1.4.0 to build a signed APK and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: versionCode is the commit count

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.LOOPER_KEYSTORE_BASE64 }}
          LOOPER_KEYSTORE_PASSWORD: ${{ secrets.LOOPER_KEYSTORE_PASSWORD }}
          LOOPER_KEY_PASSWORD: ${{ secrets.LOOPER_KEYSTORE_PASSWORD }}
          LOOPER_KEY_ALIAS: looper
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing LOOPER_KEYSTORE_BASE64 secret"; exit 1
          fi
          export LOOPER_KEYSTORE="$RUNNER_TEMP/looper-release.p12"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$LOOPER_KEYSTORE"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -Plooper.versionName="${GITHUB_REF_NAME#v}" \
            -Plooper.versionCode="$(git rev-list --count HEAD)"
          rm -f "$LOOPER_KEYSTORE"

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="looper-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Looper ${GITHUB_REF_NAME}" --generate-notes
